<div class="generator-container">
  <h1>MidiGen Studio</h1>
  <p>Configure the parameters for your new melody</p>

  <div class="controls-grid">
    <div class="control-group">
      <label for="bpm">BPM (Tempo)</label>
      <input type="number" id="bpm" [(ngModel)]="bpm" min="60" max="200">
    </div>

    <div class="control-group">
      <label for="key">Root Key</label>
      <select id="key" [(ngModel)]="selectedKey">
        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A">A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>
      </select>
    </div>

    <div class="control-group">
      <label for="scale">Scale</label>
      <select id="scale" [(ngModel)]="selectedScale">
        <option value="MAJOR">Major</option>
        <option value="MINOR">Minor</option>
        <option value="PENTATONIC">Pentatonic</option>
      </select>
    </div>
  </div>

  <button class="btn-blue generate-btn"
          [disabled]="bpm < 60 || bpm > 200"
          (click)="generateMidi()">
    Generate MIDI pattern
  </button>
</div>
